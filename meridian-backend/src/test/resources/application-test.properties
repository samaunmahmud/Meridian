# Used by @ActiveProfiles("test"): in-memory H2 instead of MySQL, and no
# background jobs / startup seeding, so tests never touch the network.
# A fresh database per Spring context, so cached contexts never share tables
spring.datasource.url=jdbc:h2:mem:meridian-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# The schema comes from the real Flyway migrations, so a mismatch with the entities fails the tests
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

meridian.scheduling.enabled=false

ALPHA_VANTAGE_API_KEY=test-key
JWT_SECRET=test-secret-test-secret-test-secret-1234567890
