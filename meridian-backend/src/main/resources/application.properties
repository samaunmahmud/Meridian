spring.application.name=meridian-backend
server.port=8080

# Reuse the same .env file Docker Compose uses — one source of truth for credentials
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only
# checks at startup that the entities still match it and refuses to start if not.
# To change the schema, add a new V<n>__description.sql file - never edit an old one.
spring.jpa.hibernate.ddl-auto=validate
# A database created before Flyway (by ddl-auto=update) already has the V1 tables:
# mark it as being at version 1 instead of trying to create them again.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# --- Market data (see MarketDataProperties) ---
# Where prices come from: "alphavantage" (default) or "finnhub".
marketdata.provider=${MARKETDATA_PROVIDER:alphavantage}
# Provider requests allowed per UTC day. 0 = the free-plan default
# (Alpha Vantage 25/day, Finnhub 50,000/day). Raise it on a paid plan.
marketdata.daily-request-budget=${MARKETDATA_DAILY_REQUEST_BUDGET:0}
# How often FX rates refresh. 0 = provider default (Alpha Vantage 6 h, Finnhub 5 min).
marketdata.fx-poll-interval-ms=${MARKETDATA_FX_POLL_INTERVAL_MS:0}

# --- Security ---
# Origins allowed to call the API from a browser (comma-separated).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
# Send the session cookie only over HTTPS. Set AUTH_COOKIE_SECURE=true in production.
auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
