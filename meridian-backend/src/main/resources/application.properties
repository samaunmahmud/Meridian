spring.application.name=meridian-backend
server.port=8080

# Reuse the same .env file Docker Compose uses — one source of truth for credentials
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" auto-creates/alters tables from our entity classes — fine for learning.
# Real production apps use a migration tool like Flyway instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# --- Market data (see MarketDataProperties) ---
# Where prices come from: "alphavantage" (default) or "finnhub".
marketdata.provider=${MARKETDATA_PROVIDER:alphavantage}
# Provider requests allowed per UTC day. 0 = the free-plan default
# (Alpha Vantage 25/day, Finnhub 50,000/day). Raise it on a paid plan.
marketdata.daily-request-budget=${MARKETDATA_DAILY_REQUEST_BUDGET:0}
# How often FX rates refresh. 0 = provider default (Alpha Vantage 6 h, Finnhub 5 min).
marketdata.fx-poll-interval-ms=${MARKETDATA_FX_POLL_INTERVAL_MS:0}
