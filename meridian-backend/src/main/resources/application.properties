spring.application.name=meridian-backend
server.port=8080

# Reuse the same .env file Docker Compose uses — one source of truth for credentials
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only
# checks at startup that the entities still match it and refuses to start if not.
# To change the schema, add a new V<n>__description.sql file - never edit an old one.
spring.jpa.hibernate.ddl-auto=validate
# A database created before Flyway (by ddl-auto=update) already has the V1 tables:
# mark it as being at version 1 instead of trying to create them again.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# READ COMMITTED, not MySQL's default REPEATABLE READ. Every order takes a row lock on the user's
# portfolio first, but under REPEATABLE READ a transaction that had already done a plain read (the
# ticker lookup) kept reading the database as it was BEFORE it waited for that lock, so two
# simultaneous orders of one account overwrote each other's holding (or crashed on a duplicate
# row). With READ COMMITTED each read sees what the previous order committed. See
# MySqlConcurrencyTest.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
# Give up on getting a database connection after 5 s (Hikari's default is 30 s). When the database is
# down, every request otherwise holds a server thread for 30 s, the whole site hangs, and /api/health
# cannot answer 503 in time for a monitor to see it.
spring.datasource.hikari.connection-timeout=5000
# Printing every SQL statement floods the logs; turn on only when debugging (SHOW_SQL=true).
spring.jpa.show-sql=${SHOW_SQL:false}
# Service methods hand back entities whose lazy relations are read while the response
# is written, so the database session stays open for the whole request.
spring.jpa.open-in-view=true

# On shutdown (a redeploy) finish in-flight requests first instead of cutting them off.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# @Scheduled jobs (price polling, FX, portfolio snapshots, recurring buys, cleanups) share
# this pool. The default is ONE thread, so a single slow job would hold up all the others.
spring.task.scheduling.pool.size=3

# Stocks trade only in the regular exchange session (09:30-16:00 New York, weekdays, minus holidays);
# a market order placed while a stock market is closed waits for the open. Crypto is always open.
# Set to false to trade stocks at any hour (e.g. for a demo).
marketdata.hours-enforced=${MARKET_HOURS_ENFORCED:true}

# Prices are stored every poll and portfolio snapshots every minute, so those tables would grow forever. Each night
# (default 03:30, server time) history older than 7 days is thinned to one value per hour, and older than 90 days to
# one per day. The last 7 days keep every row. Charts only ever ask for a bounded number of points.
history.retention.full-resolution-days=${HISTORY_FULL_RESOLUTION_DAYS:7}
history.retention.daily-after-days=${HISTORY_DAILY_AFTER_DAYS:90}
history.retention.cron=${HISTORY_RETENTION_CRON:0 30 3 * * *}

# --- Market data (see MarketDataProperties) ---
# Give up on a provider request after this long (a provider that never answers must not
# hold a scheduler thread).
marketdata.http.connect-timeout-ms=${MARKETDATA_CONNECT_TIMEOUT_MS:5000}
marketdata.http.read-timeout-ms=${MARKETDATA_READ_TIMEOUT_MS:10000}
# Market orders, recurring buys and currency conversions refuse a price / exchange rate
# older than this many minutes. 0 = worked out from the polling settings (at least 15 / 30
# minutes and three refresh rounds); set it to override.
marketdata.max-price-age-minutes=${MARKETDATA_MAX_PRICE_AGE_MINUTES:0}
marketdata.max-fx-rate-age-minutes=${MARKETDATA_MAX_FX_RATE_AGE_MINUTES:0}
# Where prices come from: "alphavantage" (default) or "finnhub".
marketdata.provider=${MARKETDATA_PROVIDER:alphavantage}
# Provider requests allowed per UTC day. 0 = the free-plan default
# (Alpha Vantage 25/day, Finnhub 50,000/day). Raise it on a paid plan.
marketdata.daily-request-budget=${MARKETDATA_DAILY_REQUEST_BUDGET:0}
# How often FX rates refresh. 0 = provider default (Alpha Vantage 6 h, Finnhub 5 min).
marketdata.fx-poll-interval-ms=${MARKETDATA_FX_POLL_INTERVAL_MS:0}

# --- Security ---
# Origins allowed to call the API from a browser (comma-separated).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
# Send the session cookie only over HTTPS. Set AUTH_COOKIE_SECURE=true in production.
auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# Behind a reverse proxy (the Docker setup's nginx) trust its X-Forwarded-* headers so
# the login rate limits see the real client address. Leave at "none" when the backend
# is reachable directly, or anyone could fake their address.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# --- Email (password reset, address verification) ---
# The address people use in the browser; the links in emails point here.
app.public-url=${PUBLIC_URL:http://localhost:5173}
# Leave MAIL_HOST empty in development: emails are then just printed in the log.
mail.host=${MAIL_HOST:}
mail.port=${MAIL_PORT:587}
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}
mail.starttls=${MAIL_STARTTLS:true}
mail.from=${MAIL_FROM:Meridian <noreply@localhost>}
